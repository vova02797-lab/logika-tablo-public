const KEY='svoya-igra-score-v1', HISTORY='svoya-igra-undo-v1';let teams=load();function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch{return []}}function save(remember=true){if(remember)localStorage.setItem(HISTORY,localStorage.getItem(KEY)||'[]');localStorage.setItem(KEY,JSON.stringify(teams));render()}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function rank(t){return 1+teams.filter(x=>x.score>t.score).length}function render(){let previousScores=new Map([...document.querySelectorAll('#board .team')].map(el=>[el.dataset.id,Number(el.dataset.score)]));let before=new Map([...document.querySelectorAll('#board .team')].map(el=>[el.dataset.id,el.getBoundingClientRect().top]));let sorted=[...teams].sort((a,b)=>b.score-a.score);document.getElementById('board').innerHTML=sorted.length?sorted.map(t=>{let n=rank(t);return `<article data-id="${t.id}" data-score="${t.score}" class="team ${n===1?'first':n===2?'second':n===3?'third':''}"><div class="rank"><span class="rank-number">${n}</span></div>${n<=3?`<img class="award" src="award-${n}.png" alt="">`:`<span class="award-spacer"></span>`}<div class="name">${esc(t.name)}</div><div class="score" aria-label="${t.score} баллов">${t.score}</div></article>`}).join(''):'<p class="hint">Команды появятся здесь после добавления в панели ведущего.</p>';document.getElementById('controls').innerHTML=teams.map(t=>`<div class="controls"><div class="control-team"><strong>${esc(t.name)}</strong><span class="current-score">${t.score} баллов</span></div><div class="score-actions"><input type="number" id="v${t.id}" placeholder="Баллы" step="1" aria-label="Баллы для команды ${esc(t.name)}"><button onclick="change('${t.id}','add')" aria-label="Прибавить баллы">＋</button><button class="alt" onclick="change('${t.id}','subtract')" aria-label="Вычесть баллы">−</button><button class="set-score" onclick="change('${t.id}','set')">Установить</button><button class="danger" onclick="removeTeam('${t.id}')">Удалить</button></div></div>`).join('');document.getElementById('board').style.setProperty('--rows',Math.max(1,Math.min(teams.length,6)));if(!matchMedia('(prefers-reduced-motion: reduce)').matches)document.querySelectorAll('#board .team').forEach(el=>{const target=Number(el.dataset.score),start=previousScores.has(el.dataset.id)?previousScores.get(el.dataset.id):0,score=el.querySelector('.score'),begin=performance.now();function tick(now){if(!el.isConnected)return;let t=Math.min(1,(now-begin)/700),ease=1-Math.pow(1-t,3);score.textContent=String(Math.round(start+(target-start)*ease));if(t<1)requestAnimationFrame(tick)}if(start!==target)requestAnimationFrame(tick)});if(!matchMedia('(prefers-reduced-motion: reduce)').matches)document.querySelectorAll('#board .team').forEach(el=>{let y=before.get(el.dataset.id);if(y!==undefined){let d=y-el.getBoundingClientRect().top;if(d)el.animate([{transform:'translateY('+d+'px)'},{transform:'translateY(0)'}],{duration:650,easing:'cubic-bezier(.22,.8,.25,1)'})}})}
function add(){let n=document.getElementById('newName');if(!n.value.trim())return;teams.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),name:n.value.trim(),score:0,color:'#53ff25',logo:''});n.value='';save()}function change(id,mode){let i=document.getElementById('v'+id);if(i.value===''||!Number.isSafeInteger(Number(i.value)))return;let t=teams.find(x=>x.id===id),v=Number(i.value),next=mode==='add'?t.score+Math.abs(v):mode==='subtract'?t.score-Math.abs(v):v;if(!Number.isSafeInteger(next))return;t.score=next;save()}function removeTeam(id){teams=teams.filter(x=>x.id!==id);save()}function undo(){let old=localStorage.getItem(HISTORY);if(old!==null){let current=JSON.stringify(teams);teams=JSON.parse(old);localStorage.setItem(KEY,JSON.stringify(teams));localStorage.setItem(HISTORY,current);render()}}function openDisplay(){window.open(location.pathname+'?display=1','scoreboard')}if(new URLSearchParams(location.search).has('display'))document.body.classList.add('display');window.addEventListener('storage',e=>{if(e.key===KEY){teams=load();render()}});render();
</script></body></html>
